# local: platform Gateway for *.local.azure.example.com with a wildcard Let's Encrypt certificate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../apps/gateway/base

labels:
  - includeSelectors: false
    pairs:
      environment: local

patches:
  - path: hostnames-patch.yaml
    target:
      kind: Gateway
      name: platform
  - path: certificate-patch.yaml
    target:
      kind: Certificate
      name: wildcard
  - path: argocd-route-patch.yaml
    target:
      kind: HTTPRoute
      name: argocd-server
