# sp-dns-local client secret for the azureDNS solver, from Key Vault secret
# cert-manager-azuredns-client-secret (written by the infra repo's Terraform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azuredns-sp
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: azuredns-sp
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: cert-manager-azuredns-client-secret
