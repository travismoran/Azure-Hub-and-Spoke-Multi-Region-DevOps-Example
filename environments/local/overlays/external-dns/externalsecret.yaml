# azure.json (sp-dns-local credentials) from Key Vault secret external-dns-azure-json,
# written there by the infra repo's Terraform.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-config-file
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: azure-config-file
    creationPolicy: Owner
  data:
    - secretKey: azure.json
      remoteRef:
        key: external-dns-azure-json
