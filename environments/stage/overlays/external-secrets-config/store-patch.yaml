# stage: the environment's Key Vault (kv-demo-stage, AKS workload identity).
- op: replace
  path: /spec/provider/azurekv/tenantId
  value: REPLACE_WITH_TENANT_ID
- op: replace
  path: /spec/provider/azurekv/vaultUrl
  value: https://kv-demo-stage.vault.azure.net
- op: replace
  path: /spec/provider/azurekv/authType
  value: WorkloadIdentity
- op: remove
  path: /spec/provider/azurekv/authSecretRef
- op: add
  path: /spec/provider/azurekv/serviceAccountRef
  value:
    name: external-secrets
    namespace: external-secrets
