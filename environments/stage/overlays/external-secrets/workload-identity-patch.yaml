# Azure workload identity for ESO on AKS: the ClusterSecretStore uses this service account's
# federated token; the identity is id-external-secrets-<stamp> from the infra repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_CLIENT_ID_OF_id-external-secrets-demo-stage-wus3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
