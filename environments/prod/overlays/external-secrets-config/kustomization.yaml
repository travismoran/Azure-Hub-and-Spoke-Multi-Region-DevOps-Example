# prod: ClusterSecretStore for kv-demo-prod + Argo CD's Google OAuth secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../apps/external-secrets-config/base

labels:
  - includeSelectors: false
    pairs:
      environment: prod

patches:
  - path: store-patch.yaml
    target:
      kind: ClusterSecretStore
      name: azure-kv
