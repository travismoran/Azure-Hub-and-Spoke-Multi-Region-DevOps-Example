# Blueprint: CloudNativePG, the PostgreSQL operator. Apps declare a `Cluster` next to their own
# manifests (apps/app-a/base/postgres-cluster.yaml) and get a managed Postgres with a generated
# app-user secret (<cluster>-app: uri, username, password, dbname); no database password is ever
# written by hand or kept in Key Vault. Chart version pinned here; environments patch resources.
# CRDs are large: the Application must sync with ServerSideApply=true.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system

resources:
  - namespace.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1   # operator 1.30.1
    releaseName: cnpg
    namespace: cnpg-system
    includeCRDs: true
    valuesFile: values.yaml
