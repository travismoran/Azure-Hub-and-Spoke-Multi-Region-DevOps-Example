# The environment's Azure Key Vault, reached as the service principal sp-eso-<env> created by
# Terraform (infra repo live/<sub>/<env>/local-cluster). Its client id/secret live in the
# bootstrap secret external-secrets/azure-kv-sp. AKS environments switch authType to
# WorkloadIdentity in their overlay. Tenant and vault URL are patched per environment.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      environmentType: PublicCloud
      tenantId: REPLACED_BY_OVERLAY
      vaultUrl: https://REPLACED_BY_OVERLAY.vault.azure.net
      authSecretRef:
        clientId:
          name: azure-kv-sp
          key: ClientID
          namespace: external-secrets
        clientSecret:
          name: azure-kv-sp
          key: ClientSecret
          namespace: external-secrets
