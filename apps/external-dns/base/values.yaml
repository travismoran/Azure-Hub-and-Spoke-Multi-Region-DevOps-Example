provider:
  name: azure
sources:
  - gateway-httproute   # hosts behind the platform Gateway (target = the Gateway's address)
  - ingress
  - service
policy: sync            # delete records when the Ingress/Service goes away
registry: txt
txtPrefix: externaldns-  # TXT ownership records live beside the A records, prefixed
interval: 1m
triggerLoopOnEvent: true
logLevel: info
# Mount the Azure provider config. The secret is environment-specific (see overlays).
extraVolumes:
  - name: azure-config-file
    secret:
      secretName: azure-config-file
extraVolumeMounts:
  - name: azure-config-file
    mountPath: /etc/kubernetes
    readOnly: true
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
