# Ingestion API: POST /v1/telemetry/events with a bearer JWT (RS256, verified against
# app-b-jwks; audience, issuer, scope Telemetry.Write and oid/upn claims required). Applies the
# schema on start and stamps the caller's identity onto every stored event.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b-api
  namespace: app-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b-api
  template:
    metadata:
      labels:
        app: app-b-api
    spec:
      imagePullSecrets:
        - name: acr-pull   # externalsecret-acr.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # "app-b" in the image
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: example.azurecr.io/app-b/api   # registry + tag patched per environment
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTH_MODE
              value: dev
            - name: JWT_AUDIENCE
              value: api://app-b-telemetry
            - name: JWT_ISSUER
              value: https://app-b.local/dev-issuer
            - name: JWKS_PATH
              value: /etc/app-b/jwks/jwks.json
            - name: FRESHNESS_WINDOW_SECONDS
              value: "300"
            # Connection string generated by CloudNativePG for the app-b-db cluster's app user.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-b-db-app
                  key: uri
          volumeMounts:
            - name: jwks
              mountPath: /etc/app-b/jwks
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwks
          configMap:
            name: app-b-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: app-b-api
  namespace: app-b
spec:
  selector:
    app: app-b-api
  ports:
    - name: http
      port: 80
      targetPort: http
