# Pull credential for the environment's Azure Container Registry. Terraform (infra repo
# modules/local-cluster, ADR-026) creates a read-only, repository-scoped ACR token and writes its
# login server, name and rotated password into the Key Vault; this templates them into the
# imagePullSecret. Nothing here is set by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-pull
  namespace: app-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: acr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .server }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: server
      remoteRef:
        key: acr-login-server
    - secretKey: username
      remoteRef:
        key: acr-pull-username
    - secretKey: password
      remoteRef:
        key: acr-pull-password
