# App secrets from the environment's Key Vault: the platform's Google OAuth client (shared with
# oauth2-proxy and Argo CD; the app-a hostname must be an authorised JavaScript origin on it)
# and the key that signs the app's own session cookie.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-a
  namespace: app-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: app-a
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-oauth-client-id
    - secretKey: SESSION_SECRET
      remoteRef:
        key: app-a-session-secret
