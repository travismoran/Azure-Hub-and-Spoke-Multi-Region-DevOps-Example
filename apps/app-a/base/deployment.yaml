apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: app-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      imagePullSecrets:
        - name: acr-pull   # externalsecret-acr.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000    # "node" in the image
        runAsGroup: 1000
        fsGroup: 1000      # the PVC is writable by the app user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-a
          image: example.azurecr.io/app-a   # registry + tag patched per environment
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_MODE
              value: google
            - name: PUBLIC_ORIGIN
              value: https://app-a.example.com   # patched per environment
            - name: TZ_DEFAULT
              value: UTC
            # The access list: the route bypasses the Gateway login (securitypolicy.yaml), so only these
            # Google accounts may sign in. Set per environment; empty would let any Google account sign up.
            - name: ALLOWED_EMAILS
              value: REPLACED_BY_OVERLAY
            # Connection string generated by CloudNativePG for the app-a-db cluster's app user.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-a-db-app
                  key: uri
          envFrom:
            - secretRef:
                name: app-a   # GOOGLE_CLIENT_ID, SESSION_SECRET
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
            - name: tmp
              mountPath: /tmp
          # The first request connects to Postgres and runs migrations.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
