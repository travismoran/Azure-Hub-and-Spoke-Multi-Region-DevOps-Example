# Wildcard certificate for the environment's zone, issued by Let's Encrypt via DNS-01 (wildcards
# are only possible with DNS-01). Replaces one certificate per host.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: gateway
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - "*.example.com"
    - example.com
