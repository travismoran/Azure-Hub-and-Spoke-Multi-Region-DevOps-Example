# oauth2-proxy's own host: Google's redirect URI (/oauth2/callback) lands here and sets the
# session cookie for the whole environment domain. Hostname patched per environment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: gateway
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.example.com
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
