# Google OAuth client + cookie secret from the environment's Key Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: google-oauth-client-id
    - secretKey: client-secret
      remoteRef:
        key: google-oauth-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy-cookie-secret
