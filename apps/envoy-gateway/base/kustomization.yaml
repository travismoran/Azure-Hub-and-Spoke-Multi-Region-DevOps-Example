# Blueprint: Envoy Gateway, the platform ingress on every cluster (Gateway API). Pulled from the
# project's OCI registry; the Application must sync with ServerSideApply=true (CRD size).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - namespace.yaml

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.10.0
    releaseName: eg
    namespace: envoy-gateway-system
    valuesFile: values.yaml
    includeCRDs: true
