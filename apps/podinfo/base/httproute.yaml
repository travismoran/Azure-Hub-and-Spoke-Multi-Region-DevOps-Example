apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: https
  hostnames:
    - podinfo.example.com   # patched per environment
  rules:
    - backendRefs:
        - name: podinfo
          port: 80
