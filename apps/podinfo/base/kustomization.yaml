# Blueprint: podinfo, a plain-manifest Kustomize base. Environments overlay replicas,
# resources and route hostnames in environments/<env>/overlays/podinfo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/part-of: platform

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.17.0
