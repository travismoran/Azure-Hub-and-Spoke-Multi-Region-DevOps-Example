apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@example.com   # ACME account contact; change if another mailbox should get expiry notices
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          azureDNS:
            environment: AzurePublicCloud
            subscriptionID: REPLACE_WITH_CONNECTIVITY_SUBSCRIPTION_ID   # connectivity subscription: all public zones live there
            tenantID: REPLACE_WITH_TENANT_ID
            resourceGroupName: rg-dns-public
            hostedZoneName: REPLACED_BY_OVERLAY
            managedIdentity:
              clientID: REPLACED_BY_OVERLAY
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          azureDNS:
            environment: AzurePublicCloud
            subscriptionID: REPLACE_WITH_CONNECTIVITY_SUBSCRIPTION_ID   # connectivity subscription: all public zones live there
            tenantID: REPLACE_WITH_TENANT_ID
            resourceGroupName: rg-dns-public
            hostedZoneName: REPLACED_BY_OVERLAY
            managedIdentity:
              clientID: REPLACED_BY_OVERLAY
