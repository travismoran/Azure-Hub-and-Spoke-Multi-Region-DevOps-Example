# Global Argo CD settings shared by every environment.
# Environment-specific keys (url, SSO, etc.) are patched in environments/<env>/argocd-install.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Allow kustomize `helmCharts:` so Helm-based blueprints in apps/ render through kustomize.
  kustomize.buildOptions: --enable-helm
  # Reconcile every 3 minutes (webhooks make this a fallback, not the primary trigger).
  timeout.reconciliation: 180s
  # Treat a child Application's health as part of the parent (app-of-apps waits on it).
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
