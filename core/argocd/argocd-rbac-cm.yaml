apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  # SSO users (Google, example.com) get read-only unless mapped below. Each environment disables
  # the local admin account (admin.enabled: "false" in its argocd-cm) once its SSO is verified.
  policy.default: role:readonly
  scopes: '[email, groups]'
  policy.csv: |
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, projects, *, *, allow
    p, role:platform-admin, repositories, *, *, allow
    p, role:platform-admin, clusters, *, *, allow
    g, platform-admins, role:platform-admin
    g, admin@example.com, role:platform-admin
